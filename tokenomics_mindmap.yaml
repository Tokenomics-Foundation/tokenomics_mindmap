Tokenomics:
  Description: "AI Tokenomics is the discipline of converting energy and capital into AI, then efficiently consuming AI services to enable intelligent outcomes and drive business value.
(Draft v0.2, August 2026)"
  children:
    Production:
      Description: "The supply side of AI. Energy, capital resources, and the economics of building and running AI in production. How capacity is planned, costed, and brought online."
      children:
        Tokenization:
          Description: "How raw text and media are converted into the tokens that get billed and processed."
          children:
            Algorithm:
              Description: "The method used to split text into tokens."
              children:
                BPE (Byte-Pair Encoding):
                  Description: "Merges frequent character pairs into subword tokens, the dominant scheme for modern LLMs."
                WordPiece:
                  Description: "A subword scheme used by BERT-family models that picks merges by likelihood rather than raw frequency."
                SentencePiece / Unigram:
                  Description: "A language-agnostic tokenizer that trains directly on raw text, common in multilingual models."
                Byte-level tokenization:
                  Description: "Operates on raw bytes so any input is representable without unknown tokens."
                Pre-tokenization rules:
                  Description: "The regex or splitting pass applied before merging, which decides how whitespace, digits, and punctuation group together."
                Tokenizer-free approaches:
                  Description: "Research directions that learn dynamic byte groupings instead of a fixed vocabulary, removing the tokenizer as a cost variable."
            Implementations:
              Description: "Concrete libraries that perform tokenization."
              children:
                tiktoken:
                  Description: "OpenAI's fast byte-pair-encoding tokenizer library."
                HuggingFace Tokenizers:
                  Description: "A widely used Rust-backed tokenizer library with many pretrained vocabularies."
                SentencePiece:
                  Description: "Google's tokenizer library implementing byte-pair and Unigram models."
            Vocabulary:
              Description: "The fixed set of tokens a model recognizes."
              children:
                Vocab size:
                  Description: "The number of distinct tokens, trading model size against how efficiently text compresses."
                Special tokens:
                  Description: "Reserved tokens such as end-of-sequence, padding, and chat roles that carry structural meaning."
                Vocab / embedding tradeoff:
                  Description: "Larger vocabularies shorten sequences but enlarge the embedding table and memory footprint."
                Chat templates:
                  Description: "The role and turn markup a model was trained to expect, which adds billable tokens to every message."
                Reserved and unused slots:
                  Description: "Vocabulary entries held back for later use, often repurposed for control tokens or tool syntax."
            Efficiency:
              Description: "How compactly a tokenizer encodes text, which directly sets token counts and cost."
              children:
                Tokens-per-word ratio:
                  Description: "How many tokens an average word consumes, a direct multiplier on cost."
                Language disparity (non-English cost premium):
                  Description: "Non-English text often uses more tokens per word, making it more expensive to process."
                Code / structured text density:
                  Description: "Code and markup tokenize inefficiently, inflating token counts for technical workloads."
                Compression rate:
                  Description: "The overall ratio of characters to tokens a tokenizer achieves."
                Tokenizer parity across providers:
                  Description: "The same text costs different token counts on different models, so quoted prices per token are not directly comparable."
            Multimodal tokenization:
              Description: "How non-text inputs are converted into tokens."
              children:
                Image patches / tiles:
                  Description: "Images are split into patches or tiles, each costing a set number of tokens."
                Audio tokens:
                  Description: "Audio is discretized into tokens, typically many per second of sound."
                Video tokens:
                  Description: "Video is tokenized per frame or clip, the most token-intensive modality."
                Resolution and detail settings:
                  Description: "Requested image detail changes how many tiles are produced, making resolution a direct cost control."
            Detokenization and streaming:
              Description: "Turning generated token ids back into text as output is produced."
              children:
                Partial token handling:
                  Description: "A single character can span several tokens, so streamed output must buffer until a boundary is safe to emit."
                Stop sequence matching:
                  Description: "Stop strings are matched on text rather than tokens, so generation can overshoot slightly before halting."
        Model / Architecture:
          Description: "The model's design, which sets the cost floor before any training or serving."
          children:
            Family:
              Description: "The high-level architectural class of the model."
              children:
                Dense transformer:
                  Description: "A standard transformer where every parameter is active on every token."
                Mixture of Experts (MoE):
                  Description: "Routes each token to a subset of expert subnetworks, cutting active compute per token."
                  children:
                    Router / gating:
                      Description: "The learned function that picks which experts see each token."
                    Top-k routing:
                      Description: "How many experts each token is sent to, setting active compute per token."
                    Shared experts:
                      Description: "Experts every token passes through, used to hold general capability outside the routed pool."
                    Load balancing:
                      Description: "Auxiliary objectives or bias terms that stop a few experts absorbing most traffic and stranding the rest."
                    Expert parallelism:
                      Description: "Spreading experts across devices, which turns routing into network traffic and makes interconnect a cost factor."
                State-space / hybrid (Mamba, etc.):
                  Description: "Non-attention or hybrid architectures that scale more cheaply with sequence length."
                Diffusion language models:
                  Description: "Models that refine a whole sequence in parallel steps rather than emitting one token at a time, with a different latency and cost profile."
            Scale:
              Description: "The size of the model, a primary driver of both quality and cost."
              children:
                Parameter count:
                  Description: "The total number of weights, correlating with capability and serving cost."
                Active vs total params (MoE):
                  Description: "In MoE models only a fraction of parameters run per token, decoupling size from compute cost."
                Model tiers (nano / small / frontier):
                  Description: "Capability tiers that let teams match model cost to task difficulty."
                Depth, width, and heads:
                  Description: "Layer count, hidden size, and head count, which together set memory footprint and how the model shards across devices."
            Context:
              Description: "How much input a model can attend to at once."
              children:
                Context window length:
                  Description: "The maximum tokens a model can process in one request, bounding prompt and memory cost."
                Positional encoding (RoPE, ALiBi):
                  Description: "Methods for encoding token position that affect how far context can be extended."
                Long-context methods:
                  Description: "Techniques that push usable context beyond the trained window, usually at added compute cost."
                  children:
                    RoPE scaling and YaRN:
                      Description: "Rescaling rotary position frequencies so a model handles sequences longer than it was trained on."
                    Attention sinks:
                      Description: "Keeping the earliest tokens permanently in cache so quality does not collapse when older context is evicted."
                Effective vs advertised context:
                  Description: "Models often degrade well before their stated limit, so the usable window is an empirical question rather than a spec."
                Quadratic cost of attention:
                  Description: "Prefill compute grows with the square of input length, which is why long prompts cost more than their token count suggests."
            Attention:
              Description: "The mechanism relating tokens to each other, and a major driver of memory and compute."
              children:
                Multi-Head Attention:
                  Description: "The standard attention with separate key and value heads, the most memory-hungry variant."
                Grouped-Query / Multi-Query Attention:
                  Description: "Shares key and value heads to shrink the KV cache and speed decoding."
                Multi-head Latent Attention (MLA):
                  Description: "Compresses keys and values into a low-rank latent space, cutting KV cache size sharply at some added compute."
                Sliding-window / sparse attention:
                  Description: "Limits attention to nearby or selected tokens to reduce cost on long inputs."
                Linear and sub-quadratic attention:
                  Description: "Reformulations that avoid the full pairwise comparison, trading exactness for cheaper scaling with length."
                FlashAttention:
                  Description: "A memory-efficient attention kernel that speeds training and inference without changing results."
            Heads and objectives:
              Description: "What the model is trained to predict, which determines what can be reused at serving time."
              children:
                Next-token prediction:
                  Description: "The standard objective, predicting one token ahead, which is what makes decoding serial."
                Parallel / diffusion decoding:
                  Description: "Refines the whole sequence over parallel denoising steps rather than one token at a time, which gives diffusion models a latency profile unlike autoregressive decoding."
                Multi-token prediction heads:
                  Description: "Extra heads trained to predict several positions ahead, useful during training and reusable as a drafter at inference."
                Input embeddings and LM head:
                  Description: "The input table mapping token ids to vectors and the output projection back to vocabulary, sized vocab times hidden dimension and sometimes sharing weights to save memory."
            Reasoning and test-time compute:
              Description: "Spending extra tokens at inference to raise answer quality, the newest and least predictable cost driver."
              children:
                Chain of thought:
                  Description: "Prompting or training the model to write intermediate steps, which raises output token counts substantially."
                Tree of Thoughts:
                  Description: "Explores and prunes branching reasoning paths, multiplying token spend for a chance at harder problems."
                Reasoning tokens:
                  Description: "Intermediate tokens a reasoning model produces before its answer, usually billed even when not shown to the user."
                Reasoning effort levels:
                  Description: "Provider controls that trade answer quality against how many reasoning tokens are spent."
                Test-time scaling:
                  Description: "Improving results by spending more inference compute rather than training a larger model, moving cost from capex to per-request spend."
            Modality:
              Description: "The kinds of input and output a model supports."
              children:
                Text:
                  Description: "Text-only input and output, the baseline modality."
                Vision / multimodal:
                  Description: "Handles images alongside text, adding vision token costs."
                Audio / speech:
                  Description: "Processes or generates audio, with its own tokenization and latency profile."
                  children:
                    Speech to text (ASR):
                      Description: "Automatic speech recognition, usually priced per second or minute of audio rather than per token."
                    Text to speech (TTS):
                      Description: "Speech synthesis, priced per character or per second of generated audio."
                Video:
                  Description: "Handles moving images, the most token-intensive input a model can accept."
                Any-to-any / omni models:
                  Description: "Single models accepting and producing several modalities, which complicates per-unit pricing."
            Openness:
              Description: "How available the model's weights and usage rights are."
              children:
                Open weights:
                  Description: "Weights are downloadable, enabling self-hosting and full cost control."
                Open source:
                  Description: "Weights plus training code and often data recipe, a stricter standard than open weights alone."
                Proprietary / API-only:
                  Description: "Accessible only through a vendor API, trading control for convenience."
                License terms:
                  Description: "The legal conditions governing commercial use, redistribution, and fine-tuning."
                Model card:
                  Description: "Published documentation of a model's intended use, training approach, and limitations."
                System card:
                  Description: "A fuller disclosure covering evaluations and safety testing for a released system, increasingly the reference for procurement review."
            Model variants:
              Description: "The distinct kinds of model a stack uses, which are priced and evaluated separately."
              children:
                Base model:
                  Description: "A pretrained model with no instruction tuning, which completes text rather than following instructions."
                Instruction-tuned model:
                  Description: "A base model post-trained to follow instructions and hold a conversation, the default for application use."
                Embedding model:
                  Description: "Produces vectors rather than text, priced per input token with no output cost, and the workhorse of retrieval."
                Reranker model:
                  Description: "Scores query and document pairs directly, more accurate than vector similarity and more expensive per candidate."
                Guardrail and classifier models:
                  Description: "Small models that screen input or output, adding a fixed per-request cost to every call they protect."
        Hardware:
          Description: "The physical infrastructure that produces tokens."
          children:
            Capacity:
              Description: "The pool of physical resources available for training and serving."
              children:
                Compute:
                  Description: "Raw processing capability for model math."
                  children:
                    GPU Capacity:
                      Description: "The number and type of GPUs available, the central constraint on throughput."
                    Accelerator type (GPU, TPU, Trainium, Inferentia, ASIC):
                      Description: "The class of chip used, each with distinct cost and performance tradeoffs."
                    Precision throughput:
                      Description: "Rated performance differs sharply by numeric format, so quoted peak figures only apply at a stated precision."
                    Generational uplift:
                      Description: "Each accelerator generation changes performance per dollar and per watt, which resets cost models on a hardware cycle."
                    TFLOPS:
                      Description: "Rated floating point operations per second, quoted per precision format and only reachable under ideal conditions."
                    Thermal design power (TDP):
                      Description: "The power draw a device is designed to sustain, which sets the facility requirement per accelerator."
                    GPU sharing (MIG, time-slicing):
                      Description: "Partitioning one accelerator across workloads, either as isolated instances or by interleaving, to raise utilization on small models."
                Memory:
                  Description: "On-device and system memory that bounds model and batch size."
                  children:
                    Storage:
                      Description: "Disk capacity for weights, datasets, and checkpoints."
                    Memory bandwidth (HBM):
                      Description: "High-bandwidth memory speed, often the true bottleneck for inference."
                    Device memory capacity:
                      Description: "How much fits on one accelerator, which decides whether a model needs sharding at all."
                    Unified and shared memory:
                      Description: "Architectures where host and accelerator share an address space, changing what fits on smaller systems."
                Networking:
                  Description: "Data movement within and between machines."
                  children:
                    Network Bandwidth:
                      Description: "Throughput between nodes, critical for distributed training and serving."
                    Interconnect (NVLink, InfiniBand):
                      Description: "High-speed links between accelerators that enable efficient model parallelism."
                    Scale-up vs scale-out:
                      Description: "Whether capacity grows by making one node bigger or by adding nodes, which changes the cost of parallelism."
                    Collective communication:
                      Description: "All-reduce and all-to-all operations that dominate distributed cost when models are split across devices."
                Power:
                  Description: "Electrical supply and heat management for the fleet."
                  children:
                    Energy:
                      Description: "Electricity consumed, a growing share of total token cost."
                    Cooling:
                      Description: "Heat removal systems required to keep dense accelerators running."
                    PUE (Power Usage Effectiveness):
                      Description: "The ratio of total facility power to IT power, measuring datacenter efficiency."
                    Rack power density:
                      Description: "Kilowatts per rack, which decides whether existing facilities can host current accelerators at all."
                    Grid and interconnection constraints:
                      Description: "Time to secure power at a site, often the true lead time behind apparent chip scarcity."
                Facilities:
                  Description: "The physical datacenter housing the hardware."
                  children:
                    Space:
                      Description: "Floor and rack space available for equipment."
                    Rack density:
                      Description: "How much compute is packed per rack, affecting power and cooling design."
                    Colocation vs owned:
                      Description: "Renting space versus building it, which sets the capex and commitment profile."
                    Siting and latency:
                      Description: "Where capacity physically sits, which decides achievable response times and which data residency rules apply."
            Performance characterization:
              Description: "How to tell whether hardware is actually being used, and what is limiting it."
              children:
                Compute-bound vs memory-bound:
                  Description: "Prefill is usually limited by arithmetic and decode by memory bandwidth, which is why the two phases behave differently."
                Arithmetic intensity:
                  Description: "Operations performed per byte moved, the number that decides which limit a workload hits."
                Roofline analysis:
                  Description: "Plotting achieved performance against arithmetic intensity to see how much headroom a kernel has."
                MFU (Model FLOPs Utilization):
                  Description: "Achieved arithmetic as a share of the hardware's rated peak, the standard measure of whether expensive silicon is earning its keep."
                Achieved memory bandwidth:
                  Description: "How much of rated bandwidth a workload actually reaches, the decode-side counterpart to MFU."
            Procurement:
              Description: "How compute capacity is acquired."
              children:
                Sourcing model (Cloud vs on-prem vs hybrid):
                  Description: "The basic decision of renting, owning, or mixing infrastructure."
                Neoclouds and GPU specialists:
                  Description: "Providers built specifically around accelerator rental, often priced and contracted differently from general-purpose clouds."
                Commitment (Reserved vs on-demand vs spot):
                  Description: "The pricing commitment chosen, trading flexibility against unit cost."
                Capacity blocks:
                  Description: "Fixed windows of guaranteed accelerator capacity bought in advance, a middle ground between on-demand and long reservations."
                GPU quotas / allocation:
                  Description: "Limits vendors place on how many accelerators a customer can access."
                Lead times:
                  Description: "The wait between ordering and receiving scarce accelerators."
                Capex vs Opex:
                  Description: "Whether compute is a capital purchase or an operating expense."
                Vendor lock-in:
                  Description: "Dependence on one provider's hardware, software, or pricing."
            Lifecycle (Intersections with HAM):
              Description: "Managing hardware from acquisition through retirement, overlapping with hardware asset management."
              children:
                Depreciation schedules:
                  Description: "How accelerator value is written down over its useful life."
                Refresh cycles:
                  Description: "The cadence of replacing hardware with newer generations."
                Failure / RMA rates:
                  Description: "How often units fail and must be returned, reducing effective capacity."
                Secondary market resale:
                  Description: "Recovering value by selling used accelerators."
                Utilization tracking:
                  Description: "Measuring how fully hardware is used, the key to cost efficiency."
            Software stack:
              Description: "The vendor libraries and toolchains between a model and the silicon, which decide portability as much as performance."
              children:
                CUDA:
                  Description: "NVIDIA's parallel computing platform, the default target for nearly all inference software."
                ROCm:
                  Description: "AMD's equivalent stack, the main route to running the same workloads on non-NVIDIA accelerators."
                Metal / MPS:
                  Description: "Apple's GPU stack, the Apple Silicon analog to CUDA and ROCm, and the layer MLX and llama.cpp target on Mac."
                Triton (kernel language):
                  Description: "A Python-like language for writing GPU kernels, distinct from the inference server of the same name."
                NCCL and collective libraries:
                  Description: "Libraries implementing multi-device communication, which dominate performance once a model is sharded."
                Driver and toolkit compatibility:
                  Description: "Version alignment between driver, toolkit, and framework, a routine source of deployment failure that costs engineer time rather than compute."
        Training:
          Description: "The process of creating and refining a model."
          children:
            Pretraining:
              Description: "The large-scale initial training that gives a model its base capabilities."
              children:
                Data curation:
                  Description: "Selecting and cleaning the training corpus, a major quality and cost lever."
                Data licensing:
                  Description: "Securing legal rights to training data."
                Synthetic data:
                  Description: "Model-generated data used to augment or replace scarce real data."
                Scaling laws:
                  Description: "Empirical relationships predicting quality from model size, data, and compute."
                Training token budget:
                  Description: "How many tokens the model sees during training, traded against parameter count under a fixed compute budget."
                Compute budget:
                  Description: "Total accelerator time allocated to a run, fixed early and difficult to revise once underway."
                Data mixing and curriculum:
                  Description: "The proportions and ordering of data sources, which shape capability without changing model size."
                Optimizer:
                  Description: "Turns gradients into weight updates, with stored state that is a large share of training memory and a choice that sets convergence speed."
                  children:
                    AdamW:
                      Description: "The default adaptive optimizer, whose two state tensors per parameter dominate optimizer memory."
                    Muon:
                      Description: "Momentum-orthogonalizing optimizer for 2D hidden weights, reaching target loss in fewer steps and cutting compute at scale."
                    Second-order / Shampoo:
                      Description: "Uses curvature for faster convergence per step, at higher per-step compute and memory."
            Post-Training:
              Description: "Steps after pretraining that adapt and align a model."
              children:
                Fine Tuning:
                  Description: "Adapting a pretrained model to a specific task or domain."
                  children:
                    Supervised fine-tuning (SFT):
                      Description: "Trains a base model on curated prompt-response pairs, the supervised step before preference alignment that yields the instruction-tuned model."
                    Full fine-tune:
                      Description: "Updating all weights, the most capable but most expensive adaptation."
                    PEFT / Adapters:
                      Description: "Parameter-efficient methods that train small add-on weights instead of the full model."
                      children:
                        LoRA (Low-Rank Adaptation):
                          Description: "Trains small low-rank matrices, cutting fine-tuning cost dramatically."
                        QLoRA (Quantized Low-Rank Adaptation):
                          Description: "Combines LoRA with a quantized base model to fine-tune on modest hardware."
                        DoRA:
                          Description: "A LoRA refinement that decomposes weights into magnitude and direction for better accuracy."
                    Prompt / Prefix tuning:
                      Description: "Learns soft prompt vectors while freezing the model, the lightest adaptation."
                    Continued pretraining:
                      Description: "Further general training on domain data before any task-specific step."
                Alignment:
                  Description: "Shaping model behavior to human preferences and safety norms."
                  children:
                    RLHF:
                      Description: "Reinforcement learning from human feedback, the standard preference-alignment method."
                    RLAIF:
                      Description: "Uses AI-generated feedback in place of human labels to cut alignment cost."
                    Constitutional AI:
                      Description: "Aligns to a written set of principles via model-generated critiques and revisions, cutting human labeling and underlying much RLAIF."
                    DPO:
                      Description: "Direct preference optimization, aligning models without a separate reward model."
                    PPO:
                      Description: "The policy optimization algorithm long used to run the reinforcement learning step in RLHF."
                    GRPO:
                      Description: "A group-relative policy optimization variant that drops the separate value model, widely used for reasoning training."
                    Reward models:
                      Description: "Models trained to score outputs, used as the objective that policy optimization maximizes."
                      children:
                        Outcome reward model (ORM):
                          Description: "Scores only the final answer, cheap to label but blind to where a reasoning trace failed."
                        Process reward model (PRM):
                          Description: "Scores each reasoning step, a denser signal at much higher labeling and inference cost."
                    Reinforcement learning with verifiable rewards:
                      Description: "Training against automatically checkable outcomes such as passing tests, which removes the human labelling bottleneck."
                Distillation:
                  Description: "Training a smaller model to mimic a larger one, lowering serving cost."
            Quantization:
              Description: "Reducing the numeric precision of weights and activations to shrink cost."
              children:
                Method:
                  Description: "When quantization is applied relative to training."
                  children:
                    PTQ (Post-Training Quantization):
                      Description: "Quantizes an already-trained model, fast but sometimes lossy."
                    QAT (Quantization-Aware Training):
                      Description: "Trains with quantization simulated, preserving more accuracy."
                Scheme:
                  Description: "How numeric ranges are mapped to lower precision."
                  children:
                    Affine quantization:
                      Description: "Uses a scale and zero-point offset to map values, handling asymmetric ranges."
                    Symmetric quantization:
                      Description: "Maps values around zero without an offset, simpler and faster."
                    Granularity:
                      Description: "Whether scales are shared per tensor, per channel, or per small block, trading accuracy against overhead."
                Algorithms:
                  Description: "Specific quantization techniques."
                  children:
                    GPTQ:
                      Description: "A one-shot post-training method that quantizes weights layer by layer with low error."
                    AWQ:
                      Description: "Activation-aware quantization that protects the most important weights."
                    SmoothQuant:
                      Description: "Shifts difficulty from activations into weights so both can be quantized together."
                    GGUF:
                      Description: "A file format and quantization scheme popular for running models locally."
                    Calibration data:
                      Description: "The sample inputs used to fit quantization scales, which quietly determines how well the result holds up."
                    bitsandbytes:
                      Description: "A library providing 8-bit and 4-bit quantization, widely used as the base for memory-efficient fine-tuning."
                    K-quants:
                      Description: "Mixed-precision block quantization variants within the GGUF family, offering a spread of size and quality points."
                Precision formats:
                  Description: "The numeric formats weights and activations use."
                  children:
                    BF16:
                      Description: "16-bit brain floating point, the common training precision."
                    FP8:
                      Description: "8-bit floating point, increasingly used to speed inference and training."
                    INT8:
                      Description: "8-bit integer precision, a widely supported inference quantization."
                    INT4:
                      Description: "4-bit integer precision, maximizing memory savings at some quality cost."
                    Microscaling formats (MXFP4, NVFP4):
                      Description: "Four-bit formats that attach a shared scale to small blocks of values, giving low precision more usable range."
                What gets quantized:
                  Description: "Different parts of the model can be reduced independently."
                  children:
                    Weight-only:
                      Description: "Compresses stored weights while computing at higher precision, the most common inference setup."
                    Activation quantization:
                      Description: "Reduces precision of intermediate values too, needed to actually use low-precision arithmetic units."
                    KV cache quantization:
                      Description: "Stores cached keys and values at lower precision, which buys concurrency rather than speed."
                Quality impact:
                  Description: "How to tell what a precision reduction actually cost."
                  children:
                    Perplexity:
                      Description: "How well a model predicts held-out text, the standard quick proxy for quantization damage and a weak predictor of task performance."
                    Task-level regression:
                      Description: "Measuring the quantized model on the actual workload, the only check that catches damage perplexity misses."
            Distributed Training:
              Description: "Splitting training across many devices to handle large models."
              children:
                Data parallelism:
                  Description: "Replicates the model across devices, each processing different data."
                Tensor parallelism:
                  Description: "Splits individual layers across devices to fit large models."
                Pipeline parallelism:
                  Description: "Splits the model by layers into stages across devices."
                Mixture of Experts:
                  Description: "Distributes expert subnetworks across devices, active only when routed to."
                Sequence / context parallelism:
                  Description: "Splits a single long sequence across devices so context length is not bounded by one device's memory."
                ZeRO and FSDP:
                  Description: "Shards optimizer state, gradients, and parameters across data-parallel ranks to cut memory per device."
                Gradient checkpointing and accumulation:
                  Description: "Trades recomputation and extra steps for lower peak memory, letting bigger batches fit on the same hardware."
            Operations:
              Description: "The practical running of training jobs."
              children:
                Checkpointing:
                  Description: "Periodically saving model state to survive failures and resume runs."
                Hyperparameter tuning:
                  Description: "Searching over training settings to improve results."
                Training compute cost:
                  Description: "The total accelerator spend to train a model."
                Failed runs and restarts:
                  Description: "Work lost to divergence or hardware failure, a real line item that rarely appears in published training costs."
                Cluster goodput:
                  Description: "The share of allocated cluster time that produced usable training progress."
            Evaluation:
              Description: "Measuring whether a trained model is actually good enough to deploy."
              children:
                Benchmarks:
                  Description: "Standard test sets used to compare models, useful for triage and weak as a proxy for production behaviour."
                  children:
                    Knowledge and reasoning benchmarks:
                      Description: "Standard multiple-choice and problem-solving sets such as MMLU and GPQA, used for coarse capability comparison."
                    Code benchmarks:
                      Description: "Function-level sets such as HumanEval and repository-level sets such as SWE-bench, which measure very different things."
                    Arena and Elo ratings:
                      Description: "Rankings derived from pairwise human preference, which capture perceived quality that fixed test sets miss."
                    pass@k:
                      Description: "The share of problems solved within k attempts, which makes the cost of retries explicit in the metric itself."
                    Long-context probes:
                      Description: "Tests such as needle in a haystack retrieval and RULER that measure usable context rather than advertised context."
                Contamination:
                  Description: "Benchmark data leaking into training, which inflates scores without improving capability."
                Held-out and internal evals:
                  Description: "Task-specific test sets built from the actual workload, the only evidence that transfers to a deployment decision."
                Cost of evaluation:
                  Description: "Evaluation is itself a token workload, and thorough evaluation of a frontier model is not cheap."
            Training economics:
              Description: "How training spend relates to what it eventually returns."
              children:
                Amortization over inference:
                  Description: "Training cost spread across the tokens the model eventually serves, which only pays back at volume."
                Build vs adapt vs prompt:
                  Description: "The choice between training a model, fine-tuning one, and getting the same result from context engineering."
                Model obsolescence:
                  Description: "A trained model depreciates as better base models arrive, shortening the window to recover its cost."
        Serving:
          Description: "Running trained models to produce tokens for users."
          children:
            KV Cache:
              Description: "Stored attention keys and values that let the model skip recomputing past tokens, the dominant inference memory cost."
              Links:
                - "https://arxiv.org/abs/2309.06180"
              children:
                Cache Management:
                  Description: "Strategies for storing, sharing, and evicting KV cache entries."
                  children:
                    Persistent Caching:
                      Description: "Keeping KV cache across requests so repeated prefixes are not recomputed."
                    Disaggregated Caching:
                      Description: "Storing the KV cache separately from compute nodes so it can be shared and scaled."
                    Cross-Engine Support:
                      Description: "Sharing cached state across different inference engines or nodes."
                      children:
                        Centralised Cache Server:
                          Description: "A shared server that holds KV cache for many workers to reuse."
                        Peer-to-Peer (P2P) Cache Transfer:
                          Description: "Moving cache directly between workers without a central store."
                    Offloading to host or storage:
                      Description: "Moving cold cache off the accelerator to slower tiers, trading transfer time for capacity."
                    LMCache:
                      Description: "An external KV cache layer that stores and reuses cache across engine instances and storage tiers."
                    NIXL:
                      Description: "A transfer library for moving KV cache between nodes, the plumbing that makes disaggregated serving practical."
                Prefix caching:
                  Description: "Reusing the cached computation of shared prompt prefixes across requests."
                  children:
                    RadixAttention:
                      Description: "Automatic reuse of shared prefixes via a radix tree over cached sequences, so prefix sharing needs no explicit cache management."
                Eviction policies:
                  Description: "Rules for which cache entries to drop when memory fills."
                PagedAttention:
                  Description: "Pages the KV cache into fixed-size blocks to cut fragmentation and raise GPU utilization."
                  Links:
                    - "https://blog.vllm.ai/2023/06/20/vllm.html"
                Cache compression:
                  Description: "Shrinking stored KV data to fit more requests in memory."
                Quantized KV cache:
                  Description: "Storing KV cache at lower precision to reduce its memory footprint."
                Cache sizing:
                  Description: "How much device memory is left for cache after weights, which sets the ceiling on concurrent requests."
            Inference Optimization:
              Description: "Techniques that lower the cost and latency of generating tokens."
              children:
                Speculative decoding:
                  Description: "Proposes several tokens ahead with a cheap drafter, then verifies them in a single target model pass, cutting per token latency without changing the output distribution."
                  Links:
                    - "https://docs.vllm.ai/en/latest/features/speculative_decoding/"
                  children:
                    Mechanics:
                      Description: "The draft then verify loop shared by every speculative method."
                      children:
                        Drafting:
                          Description: "A cheap proposer generates a candidate continuation of k tokens."
                        Verification:
                          Description: "The target model scores all candidate positions in one forward pass, so accepted tokens cost roughly one decode step."
                        Acceptance rule:
                          Description: "The test that decides how many drafted tokens survive; the standard rule is lossless, meaning accepted tokens match the target model's own distribution."
                        Tree drafting and tree attention:
                          Description: "Proposing a branching tree of candidates rather than one chain, raising the odds that some path is accepted."
                        Rollback:
                          Description: "Discarding drafted tokens after the first rejection and resuming from the last verified position."
                    Drafter designs:
                      Description: "Where proposed tokens come from, the main axis of difference between methods."
                      children:
                        Independent draft model:
                          Description: "A separate small model from the same family, simple to deploy but costs extra weights, extra memory, and its own autoregressive latency."
                        Self-drafting / early exit:
                          Description: "The target model drafts for itself by exiting at an intermediate layer or skipping layers, avoiding a second set of weights."
                        Multi-head drafting:
                          Description: "Extra prediction heads bolted onto the target model emit several future positions in parallel; Medusa and Hydra are the reference designs."
                        Feature-level drafting (EAGLE family):
                          Description: "Drafting autoregressively over the target model's hidden features rather than over tokens alone, which raises acceptance for a small drafter."
                          children:
                            EAGLE:
                              Description: "Runs draft autoregression at the feature level, reusing top layer features from the target model."
                            EAGLE-2:
                              Description: "Adds context aware dynamic draft trees, so tree shape adapts to how confident the drafter is."
                            EAGLE-3:
                              Description: "Drops the feature prediction constraint in favour of direct token prediction and fuses low, mid, and high layer features via training-time test, which lets draft quality keep improving as draft training data scales."
                              Links:
                                - "https://arxiv.org/abs/2503.01840"
                            HASS:
                              Description: "Harmonized Speculative Sampling, an EAGLE-based drafter that aligns training with multi-step inference to raise acceptance length without changing output."
                            FR-Spec:
                              Description: "Frequency-ranked speculative sampling, limiting the drafting head to a high-frequency vocab subset to cut draft cost on large vocabularies without changing output."
                        Multi-Token Prediction (MTP):
                          Description: "Extra prediction modules trained into the model itself, originally as a training objective, then reused at serving time as the drafter; DeepSeek-V3 popularised the pattern."
                          Links:
                            - "https://arxiv.org/abs/2412.19437"
                        Retrieval and n-gram drafting:
                          Description: "Model free drafting that copies candidate spans from text already in context, cheap to run and strong on repetitive or edit heavy work."
                          children:
                            Prompt lookup / n-gram:
                              Description: "Matches the recent suffix against the prompt and generation history, then proposes what followed last time."
                            Suffix decoding:
                              Description: "Builds a suffix tree over prior text and drafts from the best matching branch."
                            Retrieval from an external corpus:
                              Description: "Drafts from a datastore rather than only the current context, trading memory and lookup cost for higher acceptance on familiar material."
                        Lookahead / Jacobi decoding:
                          Description: "Generates and verifies n-grams from parallel Jacobi iterations, with no separate draft model and no extra training."
                    Execution topology:
                      Description: "How drafting and verification are placed and overlapped across hardware; the newer frontier, since drafter quality alone is hitting diminishing returns."
                      children:
                        Serial draft then verify:
                          Description: "The classic arrangement, where the drafter and target take turns on the same device; larger drafts raise acceptance but add latency on the critical path."
                        Mirror-SD:
                          Description: "Runs draft and target as two overlapping pipelines across heterogeneous accelerators, the draft proposing continuations while the target proposes correction paths, preserving the standard acceptance rule."
                          Links:
                            - "https://arxiv.org/abs/2510.13161"
                        Speculative Speculative Decoding (SSD):
                          Description: "The drafter predicts likely verification outcomes and prepares speculations for them while verification is still running, so drafting overhead disappears when the guess is right; Saguaro is the optimised algorithm."
                          Links:
                            - "https://arxiv.org/abs/2603.03251"
                    Tuning knobs:
                      Description: "The settings that decide whether speculation pays off in a given deployment."
                      children:
                        Speculation length:
                          Description: "How many tokens to propose per step; too few wastes the parallel verify, too many wastes drafting on tokens that get rejected."
                        Dynamic speculation:
                          Description: "Varying speculation length at runtime with load or drafter confidence, so speculation backs off under peak traffic."
                        Draft tree width and depth:
                          Description: "The branching budget for tree based drafters, traded against verification batch width."
                        Drafter to target size ratio:
                          Description: "The cost of proposing relative to the cost of verifying, the first lever on net speedup."
                        Vocabulary and tokenizer alignment:
                          Description: "Drafter and target must share a tokenizer and vocabulary, or need explicit mapping, which constrains which pairs can be used."
                        Draft precision:
                          Description: "Quantizing the drafter, for example to FP8, to cut its latency and memory at some cost to acceptance."
                    Economics:
                      Description: "Why speculation matters to cost and not only to latency."
                      children:
                        Acceptance rate:
                          Description: "The share of drafted tokens accepted, and the mean accepted length per step; the single number that determines whether speculation pays."
                        Latency versus throughput:
                          Description: "Speculation spends extra compute to shorten time per output token, so it improves interactivity first and cost per token only when the hardware was underused."
                        Batch size sensitivity:
                          Description: "Gains are largest at low concurrency where decode leaves the accelerator idle, and shrink as batching already fills it."
                        Wasted draft compute:
                          Description: "Rejected tokens consume real compute and energy, so goodput rather than raw throughput is the honest measure."
                        Drafter overhead:
                          Description: "Draft weights, draft KV cache, and verification of extra positions all take memory that would otherwise serve more concurrent requests."
                        Drafter lifecycle cost:
                          Description: "Trained drafters such as EAGLE heads and MTP modules must be produced, evaluated, and retrained per target model and per quantization, an ongoing cost that sits outside serving."
                        Effect on billing:
                          Description: "Speculation does not change how many tokens a buyer is billed for; it changes what those tokens cost to produce, so the benefit lands with whoever owns the serving hardware."
                    Engine support:
                      Description: "Which serving stacks expose which methods, the practical constraint on what can be adopted."
                      children:
                        vLLM:
                          Description: "Exposes speculation as a configured method, covering draft models, EAGLE and EAGLE-3, MTP, MLP and parallel draft models, n-gram, and suffix decoding."
                          Links:
                            - "https://docs.vllm.ai/en/latest/features/speculative_decoding/"
                        TensorRT-LLM:
                          Description: "NVIDIA's engine, with native speculative decoding support across draft model, EAGLE, and MTP style paths."
                        SGLang:
                          Description: "Ships EAGLE family speculative decoding alongside its structured generation and prefix reuse features."
                Prefill / Decode disaggregation:
                  Description: "Separates the compute-heavy prefill phase from the memory-bound decode phase for efficiency."
                Chunked prefill:
                  Description: "Breaks long prompt processing into chunks to smooth latency and batching."
                Parallelism (tensor / pipeline / model sharding):
                  Description: "Splits a model across devices so it fits and serves faster."
                Memory hierarchy and offloading:
                  Description: "Serving a model whose weights exceed accelerator memory by placing state across GPU, host memory, and storage."
                  children:
                    Weight offloading:
                      Description: "Holding part of the weights in host memory or on disk and moving them in as needed, trading interconnect bandwidth for capacity."
                    Expert residency and caching:
                      Description: "Which MoE experts stay resident on the accelerator, with the rest fetched or computed elsewhere as routing demands them."
                    CPU and GPU co-execution:
                      Description: "Running some experts or layers on the host processor rather than moving their weights, worthwhile when host compute is cheaper than the transfer."
                    Interconnect bandwidth as the constraint:
                      Description: "Host link throughput setting the ceiling once weights no longer fit, the binding limit in offloaded serving."
                    Bandwidth-adaptive scheduling:
                      Description: "Dividing work between transfer and host execution according to measured bandwidth rather than committing to one fixed strategy."
                    Elastic memory allocation:
                      Description: "Resizing the split between weight cache and KV cache while the engine runs, which avoids a restart when available memory changes."
                Kernels and compilation:
                  Description: "The low-level code that actually executes the model, often worth more than any algorithmic change."
                  children:
                    Fused kernels:
                      Description: "Combining several operations into one to avoid repeated trips to memory."
                    CUDA graphs:
                      Description: "Replaying a captured sequence of GPU operations to remove per-step launch overhead, which matters most at small batch sizes."
                    Graph compilation:
                      Description: "Ahead-of-time compilation of the model graph, trading startup time for steady-state speed."
                    Attention backends:
                      Description: "Interchangeable attention implementations, where the chosen backend constrains which other features can be enabled."
                      children:
                        FlashInfer:
                          Description: "A kernel library providing attention implementations tuned for serving workloads."
                    Quantized matmul kernels:
                      Description: "Specialised kernels such as Marlin that make low-precision weights actually faster rather than merely smaller."
                Quantized inference:
                  Description: "Serving a reduced-precision model to cut memory and raise throughput, the most widely used single optimization."
                Structured output enforcement:
                  Description: "Constraining decoding to a grammar or schema, which improves reliability and can reduce wasted retries."
            Batching:
              Description: "Grouping requests to raise GPU utilization."
              children:
                Static batching:
                  Description: "Fixed batches formed before processing, simple but less efficient."
                Continuous batching:
                  Description: "Dynamically adds and removes requests mid-flight to maximize throughput."
                Cold Starts:
                  Description: "The latency and cost of loading a model before it can serve, worst after idle periods."
                Scheduling policy:
                  Description: "The rules deciding which waiting requests join the next step, which sets the fairness and tail latency profile."
                Admission control and queueing:
                  Description: "Holding or rejecting work when the engine is saturated, the alternative to letting latency degrade for everyone."
                Batch size and the latency tradeoff:
                  Description: "Larger batches raise tokens per second per accelerator while lengthening the wait for any individual request."
            Scaling:
              Description: "Adjusting serving capacity to match demand."
              children:
                Autoscaling:
                  Description: "Automatically adding or removing serving capacity with load."
                Load balancing:
                  Description: "Distributing requests across workers to avoid hotspots."
                  children:
                    Cache-aware routing:
                      Description: "Sending a request to the worker that already holds its prefix, which turns routing into a cost optimization."
                Multi-tenancy:
                  Description: "Serving many users or models on shared hardware to raise utilization."
                Scale to zero:
                  Description: "Releasing capacity entirely when idle, trading cold start latency for eliminated idle cost."
                Replica sizing:
                  Description: "Choosing how many accelerators back one model instance, which sets both the granularity of scaling and the parallelism overhead."
                Model multiplexing:
                  Description: "Hosting several models or adapters on one deployment, including LoRA swapping and sleeping idle models to reclaim memory."
            Performance:
              Description: "The latency and throughput metrics that define serving quality and cost."
              children:
                TTFT (Time To First Token):
                  Description: "How long until the first output token appears, driving perceived responsiveness."
                TPOT / ITL (inter-token latency):
                  Description: "The time between successive output tokens."
                Throughput vs latency:
                  Description: "The core serving tradeoff between total tokens per second and per-request speed."
                SLOs:
                  Description: "Service level objectives that set target latency and availability."
                End-to-end latency:
                  Description: "Total time to complete a request, the sum of queueing, prefill, and all decode steps."
                Goodput:
                  Description: "Throughput counting only work that met its latency target and was actually used, the honest version of the metric."
                Concurrency:
                  Description: "How many requests are in flight at once, the knob that trades per-request latency against total throughput."
                Tail latency:
                  Description: "Behaviour at the slow end of the distribution, which governs user experience far more than the average does."
                Saturation point:
                  Description: "The load beyond which added traffic degrades latency without raising throughput."
                Requests per second (QPS):
                  Description: "Completed requests per second, the capacity unit that translates most directly into replica sizing."
                Latency percentiles:
                  Description: "Median and tail figures such as p50, p95, and p99, which describe the distribution that an average conceals."
            Reliability:
              Description: "Keeping a serving deployment healthy under real traffic."
              children:
                Health checks and draining:
                  Description: "Detecting bad workers and removing them without dropping in-flight requests."
                Out-of-memory failures:
                  Description: "The most common serving failure, usually caused by cache growth rather than by weights."
                Preemption and eviction:
                  Description: "Pausing or dropping running requests under memory pressure, which wastes already-spent compute."
                Version and weight rollout:
                  Description: "Changing model versions without downtime, and the cost of running two versions during a cutover."
            Inference Engines:
              Description: "Software that runs models to serve tokens."
              children:
                Datacenter engines:
                  Description: "High-throughput engines for server-class GPUs."
                  children:
                    vLLM:
                      Description: "A high-throughput open-source engine known for PagedAttention."
                    TensorRT-LLM:
                      Description: "NVIDIA's optimized inference library for its GPUs."
                    SGLang:
                      Description: "An engine optimized for structured generation and fast prefix reuse."
                    TGI:
                      Description: "Hugging Face's Text Generation Inference server."
                    LMDeploy:
                      Description: "A toolkit for compressing and serving LLMs efficiently."
                    DeepSpeed-MII:
                      Description: "Microsoft's low-latency inference engine built on DeepSpeed."
                Local / edge runtimes:
                  Description: "Engines for running models on personal or edge hardware."
                  children:
                    llama.cpp (Ollama, LM Studio):
                      Description: "A CPU and GPU runtime for running quantized models locally."
                    ExLlamaV2:
                      Description: "A fast runtime for quantized models on consumer GPUs."
                    CTranslate2:
                      Description: "An efficient inference engine for transformer models on CPU and GPU."
                    MLC-LLM:
                      Description: "A compiler-based runtime that deploys models across many devices."
                    MLX / mlx-lm:
                      Description: "Apple's array framework for Apple Silicon, supporting local inference and LoRA fine-tuning on Mac over unified memory with 4- and 8-bit quantization."
                    FreeToken:
                      Description: "An edge-native MoE engine treating GPU, CPU, host memory, and interconnect as one pool to serve models larger than accelerator memory."
                Serving orchestration:
                  Description: "Infrastructure that manages models and traffic at scale."
                  children:
                    Triton Inference Server:
                      Description: "NVIDIA's server for deploying and managing many models."
                    Ray Serve:
                      Description: "A scalable model-serving framework built on Ray."
                    KServe:
                      Description: "A Kubernetes-native platform for serving models."
                    NVIDIA Dynamo:
                      Description: "A framework for distributed inference across nodes, including disaggregated prefill and decode."
                    llm-d:
                      Description: "A Kubernetes-native stack for distributed LLM serving, including cache-aware routing across replicas."
                Packaged / managed:
                  Description: "Prebuilt or hosted serving offerings that trade cost for convenience."
                  children:
                    NVIDIA NIM:
                      Description: "NVIDIA's packaged inference microservices that wrap optimized engines."
                    Fireworks / Together / Baseten:
                      Description: "Managed inference providers that host open models behind an API."
                    Friendli:
                      Description: "A managed inference service focused on high efficiency."
        Sustainability:
          Description: "The energy and environmental accounting of token production, increasingly a reported figure rather than an internal one."
          children:
            Energy per token:
              Description: "Electricity consumed to produce a unit of output, the bridge between infrastructure efficiency and environmental reporting."
            Carbon intensity:
              Description: "Emissions per unit of energy, which varies by grid and therefore by region and time of day."
            Water use:
              Description: "Consumption associated with cooling, a growing constraint on where capacity can be sited."
            Embodied impact:
              Description: "The footprint of manufacturing and disposing of hardware, separate from the cost of running it."
            Disclosure and reporting:
              Description: "Obligations to report environmental impact, which turn an operational number into a compliance one."
    Consumption:
      Description: "Owns delivering AI services: how much is consumed, where the waste lives, and how to serve efficiently without degrading outcomes."
      children:
        Prompt / Context Engineering:
          Description: "Per-request techniques that control how many tokens a call uses."
          children:
            Prompt design (few-shot, system prompts):
              Description: "Structuring prompts and examples to get good results with fewer tokens."
              children:
                System prompt:
                  Description: "Standing instructions sent with every request, a fixed token cost paid on every call unless a provider cache serves it at the cached read rate."
                Prompt ordering for cacheability:
                  Description: "Stable content first, growing content next, per-request content last, since cached reuse stops at the first token that differs from the previous request."
                Few-shot examples:
                  Description: "Worked examples included in context, which raise quality and input token count together."
                Zero-shot instruction:
                  Description: "Relying on instruction alone with no examples, the cheapest prompt shape."
                Delimiters and formatting:
                  Description: "Markup that separates instructions from data, which reduces confusion and injection risk."
            Prompt compression:
              Description: "Shortening prompts while preserving meaning to cut input cost."
            Context window management:
              Description: "Deciding what to include or drop to stay within budget and window limits."
              children:
                Truncation and sliding windows:
                  Description: "Dropping the oldest turns once the window fills, the simplest and most lossy strategy."
                Summarization and rolling memory:
                  Description: "Replacing old turns with a compact summary, trading a one-off generation cost for lower ongoing input cost."
                Chunking:
                  Description: "Splitting long documents into pieces sized for retrieval and for the window."
                Overflow handling:
                  Description: "What happens when assembled context exceeds the limit, which is a correctness issue as much as a cost one."
            Output length control (max tokens, stop sequences):
              Description: "Capping generation length to control output cost."
            Structured outputs (JSON mode, grammars):
              Description: "Constraining output format to reduce retries and wasted tokens."
              children:
                JSON mode:
                  Description: "Forcing syntactically valid JSON output, the most common structured mode."
                Grammar-constrained decoding:
                  Description: "Restricting each next token to those a formal grammar allows, which makes malformed output impossible rather than unlikely."
                Tool and function schemas:
                  Description: "Declared call signatures the model selects from, which occupy input tokens on every request that offers them."
            Token budgeting / counting:
              Description: "Tracking token use per call to forecast and cap spend."
              children:
                Pre-flight counting:
                  Description: "Measuring a request before sending it, the only way to enforce a budget rather than discover it afterward."
                Per-turn and per-session budgets:
                  Description: "Limits applied at the level a user or agent actually operates, rather than per request."
            Context failure modes:
              Description: "Ways that longer context stops helping and starts hurting."
              children:
                Lost in the middle:
                  Description: "Information placed mid-context is used less reliably than material at the start or end, so more context is not automatically better."
                Context rot:
                  Description: "Accumulated stale or contradictory context degrading answers over a long session."
                Prompt injection:
                  Description: "Untrusted content in context being treated as instruction, a security problem with direct cost consequences when it triggers loops."
        Optimization:
          Description: "Levers that reduce the number or price of tokens consumed."
          children:
            Model Selection:
              Description: "Choosing the right model for each task to balance quality and cost, the portfolio decision made at design time; Routing applies the same criteria per request at run time."
              children:
                Benchmarking:
                  Description: "Testing models on representative tasks to compare quality."
                Capability tiers:
                  Description: "Grouping models by strength so the cheapest adequate one can be picked."
                Cost per task:
                  Description: "Measuring what completing a real task costs, not just per-token price."
                Accuracy vs price tradeoff:
                  Description: "Weighing quality gains against the higher cost of stronger models."
                Open vs proprietary:
                  Description: "Whether to self-host open weights or buy an API, a decision about control and fixed versus variable cost."
                Migration cost:
                  Description: "Prompts, evals, and guardrails are tuned per model, so switching is rarely as cheap as the price difference suggests."
            Routing:
              Description: "Directing each request to the model or serving path that meets the task's quality bar at the lowest cost, the decision layer over a mixed portfolio of hosted and open-weight models. A router answers the cost question against a quality bar set elsewhere; it does not define the bar."
              children:
                Proxy:
                  Description: "A transparent pass-through on the request path: it forwards every call unchanged, collects metadata, and enforces network-level concerns such as rate limits and retries. It makes no model decision; the caller's chosen model is the model that answers."
                Router:
                  Description: "The decision layer: picks which model or serving path handles each request from request properties or rules, such as query complexity, cache continuity, or right-sizing to capability tiers. It puts traffic on the rails rather than holding it."
                Gateway:
                  Description: "The superset that houses proxy and router functions and adds organization-level policy (which teams may use which models), full observability, and resiliency such as multi-provider failover. You add routing to a gateway, not a gateway to a router."
                Small vs large routing:
                  Description: "Sending easy requests to small models and hard ones to large models."
                Cascades / fallback:
                  Description: "Trying a cheap model first and escalating only when a check on the first answer fails, the pattern; confidence-based escalation and output validation are the usual triggers."
                Cost-based routing:
                  Description: "Choosing among eligible models by current price and expected quality, the comparison that cost per task is meant to settle rather than the per-token price sheet."
                Semantic routing:
                  Description: "Routing by request meaning or category to the best-suited model."
                Confidence-based escalation:
                  Description: "Using the first model's own uncertainty to decide whether a stronger model is needed, the signal most cascades run on."
                Routing ownership:
                  Description: "Who owns the router matters when the routing layer comes from a company that also sells models, since the picker can favor its own inventory. A material share of buyers build the layer in-house, which makes build versus buy read as a trust decision, not only a tooling gap. The routing decision can also carry a governance role (access policy, budgets, monitoring) depending on the router; where that role lives, in the router, a gateway, or a separate governance platform in front of everything, is unsettled. Related: aggregators and gateways under Access and Delivery."
                Routing and caching interaction:
                  Description: "Provider caches are machine-local, so which machine a request reaches decides whether a cached prefix exists there; affinity fields tie a session to a machine, and routing across models with different tokenizers or hardware invalidates cache continuity entirely. A router that ignores cache placement silently converts cache hits into writes. Related: prefix stability and model version binding under Caching."
                Misroutes and routing quality:
                  Description: "Requests a classifier sends to a model that cannot handle them, answered confidently and incorrectly. Damage per misroute runs many multiples of the request cost, and uninstrumented misroutes surface months later through customer harm rather than the bill, so per-tier quality monitoring and a log of which model served every request are prerequisites to trusting a cost-based router."
                Router overhead:
                  Description: "Classification adds its own latency and tokens, and spreading traffic across models splits one warm cache into several cold ones, which can erase the saving on short requests."
            Caching:
              Description: "Reusing prior results to avoid paying for repeated work, measured against a provider-specific break-even rather than a generic hit-rate feeling."
              Links:
                - "https://www.tokeneconomics.com/cache-explainer-consumption-wg-internal-draft/"
              children:
                Cache measurement:
                  Description: "The ratios that decide whether a cache earns its keep, computed from token buckets in usage payloads and compared per workload, never blended."
                  children:
                    Reuse ratio:
                      Description: "Tokens read from cache divided by tokens written to cache over the same window: pulls off the shelf over pulls paid to put there, the payback measure for the cache."
                    Break-even ratio:
                      Description: "The static target set by one price sheet: (write price multiple minus 1) over (1 minus read price multiple). At a typical 1.25x write premium and 0.1x read rate it is about 0.28, and it is zero wherever writes are free; the reuse ratio must clear it."
                    Cache hit rate:
                      Description: "Cache-read tokens over all input tokens (reads, writes, and uncached): coverage, driven mostly by prompt ordering, which can look healthy while the payback stays under break-even."
                    Cache cost efficiency:
                      Description: "The fraction of prompt spend caching actually avoided: one minus actual prompt cost over the uncached-equivalent cost, the dollar-shaped readout of the ratios above."
                    Per-workload measurement:
                      Description: "One high-volume cached workload will mask a dozen broken ones in a blended number, so every cache ratio is tracked per workload and re-checked when model versions or price sheets change."
                Provider-side prompt caching:
                  Description: "Vendor caching of repeated prompt prefixes at a discounted rate, billed through separate cache write and cache read token buckets on every response."
                  children:
                    Prefix stability:
                      Description: "Cached reuse requires an exact shared prefix starting at token zero, so anything that varies must sit at the end of the prompt and serialization must be frozen."
                    Cache lifetime:
                      Description: "Cached prefixes expire after an idle period, and some providers age the clock from the start of the request that touches the entry, which ties the benefit to traffic cadence rather than to prompt design alone."
                    Minimum cacheable prefix:
                      Description: "Each model sets a minimum prefix length, from hundreds to thousands of tokens, below which caching silently does nothing instead of returning an error."
                    Model version binding:
                      Description: "A cache entry belongs to one exact model version, so escalating to another model or a provider shipping an update invalidates prefixes fleet-wide with no change on the consumer side."
                    Hidden prompt content:
                      Description: "A hosted harness inserts its own system content ahead of the user prompt, occupying the head of the prefix and often excluded from the minimum cacheable length, while reasoning and tool-output tokens cache inside earlier turns and bill as input when read back."
                    Cache isolation:
                      Description: "Provider caches are partitioned per organization, workspace, and region, so there is no cross-customer reuse; within a tenant, a fleet of agents on one prefix shares a warm entry, but a parallel fan-out misses together and pays its own writes."
                    Cache write vs read pricing:
                      Description: "Writing to cache usually costs a premium over a normal input token while reading costs a small fraction of one, so caching only pays above a reuse threshold set by the price sheet."
                    Provider differences:
                      Description: "Published write charges, read discounts, minimum lengths, and lifetimes differ sharply between frontier providers, and the terms can change without notice (a major provider introduced cache write charges in mid-2026), which is why shared cache metrics must stay agnostic to any vendor implementation."
                      Links:
                        - "https://platform.claude.com/docs/en/build-with-claude/prompt-caching"
                        - "https://developers.openai.com/api/docs/guides/prompt-caching"
                Cache access modes:
                  Description: "How much cache control and cache observability a consumer gets depends on the door they enter through, from fully hidden to fully exposed."
                  children:
                    Web UI and chat apps:
                      Description: "The provider's own chat surface assembles the prompt entirely and reports no token buckets at all; caching is folded into plan economics and stays invisible to the user by design."
                    First-party agent tools:
                      Description: "The provider's own coding or coworking harness manages breakpoints automatically and exposes session-level token dashboards, but its dollar figures are computed locally at list rates, so they show shape rather than the real bill."
                    Third-party tools:
                      Description: "Products that rehost frontier models behind a proxy assemble the prompt themselves and bill in credits or requests, netting cache savings into a pooled price so they never appear on the customer's side of the glass."
                    Direct API:
                      Description: "Full control of prompt structure and breakpoint placement, with every cache bucket returned on every response and billed line by line: full visibility and full responsibility."
                    Subscription feedback asymmetry:
                      Description: "On flat plans cache misses surface as rate limits rather than line items, so the feedback channel is throttling without explanation and cache economics must be inferred rather than observed."
                Semantic caching:
                  Description: "Serving cached answers for semantically similar queries."
                Embedding caching:
                  Description: "Storing computed embeddings so unchanged documents are not re-embedded on every index run."
            AI memory:
              Description: "Giving models access to prior context and external knowledge."
              children:
                Knowledge injection patterns:
                  Description: "How knowledge reaches the model at query time, the architectural choice that sets both latency and the shape of the per-query bill."
                  children:
                    RAG (Retrieval-Augmented Generation):
                      Description: "Fetching relevant documents to ground responses and cut hallucination."
                    CAG (Cache-Augmented Generation):
                      Description: "Preloads the whole knowledge set into the context window once, caches the resulting model state, and answers every later query from that cache with no retrieval step at query time."
                      Links:
                        - "https://arxiv.org/abs/2412.15605"
                      children:
                        Corpus fit:
                          Description: "Viable only when the knowledge set fits inside the context window, which makes context length the gating constraint rather than index size."
                        Cache build cost:
                          Description: "A one-off prefill over the entire corpus, paid again on every rebuild, which is the fixed cost the per-query saving has to repay."
                        Staleness and invalidation:
                          Description: "The cache is precomputed, so any document change requires rebuilding it, making update frequency the deciding factor against retrieval."
                        Per-query cost shape:
                          Description: "Removes retrieval and reranking calls but presents the full corpus as input on every query, so the economics depend entirely on cached input being priced below normal input."
                    Hybrid CAG and RAG:
                      Description: "Caches a stable core of knowledge and retrieves only for queries falling outside it, keeping the latency benefit while bounding staleness."
                    Long-context stuffing:
                      Description: "Placing source material directly in the prompt with no caching or retrieval layer, the simplest pattern and the most expensive per query at volume."
                    Precomputed document caches:
                      Description: "Building and storing reusable cached state per document chunk so retrieved passages skip prefill, a middle path that keeps retrieval but removes most of its compute cost."
                    Knowledge in weights:
                      Description: "Training knowledge into the model through fine-tuning or continued pretraining, which removes per-query context cost entirely and replaces it with retraining cost on every update."
                    GraphRAG:
                      Description: "Builds a knowledge graph and community summaries over the corpus so questions spanning many documents can be answered, at a much higher one-off indexing cost."
                    Agentic RAG:
                      Description: "An agent plans and refines its own retrieval over several rounds, which raises answer quality and multiplies both retrieval calls and generation cost."
                    Self-correcting retrieval:
                      Description: "The model judges whether retrieved passages are adequate and retrieves again or falls back to another source, trading extra calls for fewer wrong answers."
                Vector stores:
                  Description: "Databases of embeddings that power semantic retrieval."
                Short vs long-term memory:
                  Description: "Distinguishing per-session context from persistent recall."
                Context compression / summarization:
                  Description: "Condensing history to keep context small and cheap."
                Chunking and embedding cost:
                  Description: "Indexing is its own token workload, paid up front and again on every re-index."
                Reranking:
                  Description: "A second scoring pass over retrieved candidates, which raises precision and lets fewer documents be sent to the model."
                Retrieval quality and wasted context:
                  Description: "Irrelevant retrieved passages are billed as input tokens and can actively degrade the answer."
                Retrieval mechanics:
                  Description: "How candidate passages are found and ordered, the layer beneath any retrieval pattern."
                  children:
                    Dense retrieval:
                      Description: "Matching by embedding similarity, which captures meaning and misses exact identifiers."
                    Sparse retrieval (BM25):
                      Description: "Classic lexical scoring on term overlap, which handles names, codes, and rare terms that embeddings blur."
                    Hybrid search:
                      Description: "Combining dense and sparse scores, usually the strongest default because their failure modes differ."
                    ANN indexes (HNSW, IVF):
                      Description: "Approximate nearest neighbour structures that make vector search fast, trading a little recall for large speed gains."
                    Embedding dimensions:
                      Description: "Vector width, which sets storage and search cost across the whole corpus and is fixed at index time."
                    Matryoshka embeddings:
                      Description: "Embeddings trained so a truncated prefix stays usable, letting dimensions be cut later to reclaim storage and speed."
                    Multi-vector retrieval (ColBERT):
                      Description: "Storing per-token vectors and scoring by late interaction, which raises accuracy and sharply raises index size."
                    Query rewriting and expansion:
                      Description: "Reformulating the user question before search, which costs a small generation and often beats tuning the index."
                    HyDE:
                      Description: "Generating a hypothetical answer and retrieving against its embedding, so the search vector matches document style rather than question style."
                    Contextual retrieval:
                      Description: "Prepending a short generated summary of surrounding context to each chunk before indexing, which improves recall and adds a one-off generation cost per chunk."
                    Late chunking:
                      Description: "Embedding the full document first and pooling per chunk afterwards, so chunk vectors retain document context."
                    Hierarchical summarization indexes (RAPTOR):
                      Description: "Recursively clustering and summarizing the corpus into a tree, so queries can be answered at the right level of abstraction."
            Agentic:
              Description: "Multi-step, tool-using workflows that can multiply token consumption."
              children:
                Token amplification:
                  Description: "The way agent loops turn one task into many model calls and tokens."
                  children:
                    Context resend per step:
                      Description: "Each turn resends the accumulated history, so input cost grows with the square of conversation length unless cached."
                    Tool call round trips:
                      Description: "Every tool invocation costs a generation to call it and another pass to interpret the result."
                    Retries and self-correction:
                      Description: "Failed steps are re-attempted with the failure added to context, which compounds cost on exactly the hardest tasks."
                    Reflection loops:
                      Description: "Steps where the model critiques and revises its own work, doubling or more the tokens per unit of output."
                    Sub-agent fan-out:
                      Description: "Delegating to parallel sub-agents multiplies concurrent spend and is the fastest way to an unexpected bill."
                Context accumulation:
                  Description: "Growing context as an agent gathers state, steadily raising cost."
                Sub-agents / orchestration:
                  Description: "Coordinating multiple agents, each adding token overhead."
                  children:
                    Coordination overhead:
                      Description: "Tokens spent on briefing, handoffs, and duplicated context beyond the work performed by the agents themselves."
                    Model tiering:
                      Description: "Planning on a stronger model while delegating execution to cheaper ones, reserving the most expensive tokens for judgment."
                    Single vs multi-agent tradeoff:
                      Description: "Comparing one agent with many at the same total token budget separates gains from coordination from gains due simply to extra spend."
                Tool-call overhead:
                  Description: "The extra tokens spent describing tools and parsing their results."
                Step and turn budgets:
                  Description: "Hard caps on loop iterations, the main defence against an agent spending without bound."
                Trajectory observability:
                  Description: "Tracing every model call inside a run, without which agent cost cannot be attributed to a cause."
                Waste attribution:
                  Description: "Splitting an agent run's spend into what the task inherently required and what the loop added, so optimization targets the removable part."
                  children:
                    Capability limit vs harness waste:
                      Description: "Whether extra tokens buy capability the task needs or are overhead the scaffold could avoid, the line that decides what is fixable."
                    Harness overhead:
                      Description: "Tokens the scaffold consumes before task work begins, including system prompts, tool schemas, and coordination instructions."
                    Compaction economics:
                      Description: "Trimming or summarizing accumulated context cuts per-turn cost but can trigger re-read loops that spend more than they save."
                Tool and protocol layer:
                  Description: "How an agent reaches the outside world, and the standards forming around it."
                  children:
                    Function calling / tool use:
                      Description: "The model emitting a structured call the application executes, the mechanism underneath every agent framework."
                    MCP (Model Context Protocol):
                      Description: "An open protocol for connecting models to tools and data through one interface, replacing bespoke integration per tool."
                    A2A (Agent to Agent):
                      Description: "A protocol for communication between separate agent systems, addressing coordination rather than tool access."
                    Computer and browser use:
                      Description: "Agents driving a screen or browser directly, which consumes vision tokens per step and is among the most expensive interaction modes."
                    ReAct pattern:
                      Description: "Interleaving reasoning and action steps, the loop shape most agent implementations follow."
                    Agent frameworks:
                      Description: "Libraries providing the loop, memory, and tool plumbing, which set defaults that quietly determine token spend."
            Sampling and decoding controls:
              Description: "Request-level settings that change both output character and cost."
              children:
                Temperature and top-p:
                  Description: "Controls on randomness, which affect consistency and therefore retry rates."
                Multiple samples (n, best-of):
                  Description: "Generating several candidates per request, a direct multiplier on output cost."
                Self-consistency:
                  Description: "Sampling several reasoning paths and taking the majority answer, buying accuracy with a fixed cost multiple."
                Seeds and determinism:
                  Description: "Reproducibility controls, which matter for evaluation and for caching."
                Greedy decoding:
                  Description: "Always taking the highest probability token, deterministic and prone to repetition."
                Top-k sampling:
                  Description: "Restricting choice to the k most likely tokens before sampling."
                Min-p sampling:
                  Description: "Setting a floor relative to the top token's probability, which adapts the candidate pool to model confidence."
                Repetition and frequency penalties:
                  Description: "Downweighting tokens already produced, which suppresses loops that would otherwise run to the token limit and bill for it."
                Logit bias:
                  Description: "Directly raising or lowering the odds of specific tokens, a blunt way to force or forbid particular output."
                Beam search:
                  Description: "Exploring several candidate sequences in parallel and keeping the best, which multiplies compute and is rarely used for chat."
        Workloads / Use Cases:
          Description: "The application types that consume AI capacity, each with a distinct cost profile."
          children:
            Chat / assistant:
              Description: "Interactive conversation, typically bursty and latency-sensitive."
            Code generation:
              Description: "Producing and editing code, often long-output and context-heavy."
            Coding agents:
              Description: "Autonomous multi-step code work, among the most token-intensive workloads in production."
              children:
                Session cost variance:
                  Description: "The spread in spend across runs of the same task, wide enough to make per-task budgeting unreliable."
                Harness sensitivity:
                  Description: "How the surrounding agent scaffold changes the same model's cost and success rate, making the harness a first-class cost variable."
                Subscription vs metered access:
                  Description: "Whether agent usage is bought as a flat plan or paid per token, which decides who absorbs usage variance."
                Native spend controls:
                  Description: "Usage dashboards, budgets, and limits exposed inside an agent product rather than only through the underlying billing layer."
            RAG / search:
              Description: "Retrieval-grounded question answering over a corpus."
            Summarization:
              Description: "Condensing long inputs, input-heavy and output-light."
            Extraction / classification:
              Description: "Pulling structured data or labels from text, usually short outputs."
            Translation:
              Description: "Converting between languages, where tokenizer efficiency varies sharply by language pair."
            Embeddings and indexing:
              Description: "Producing vectors rather than text, priced differently and dominated by corpus size."
            Synthetic data and evaluation:
              Description: "Using models to generate training data or to grade other models, an internal workload easily larger than production traffic."
            Vision workloads:
              Description: "Applications built on image input, billed as tiles plus output tokens."
              children:
                OCR / document parsing:
                  Description: "Reads text and layout from images and PDFs, billed as input tiles plus transcribed output tokens."
                Image captioning:
                  Description: "A text description of an image, short on output with cost dominated by input tiles."
                Visual question answering (VQA):
                  Description: "Answers questions grounded in an image, combining tile input with reasoning-length output."
                Chart and screen reading:
                  Description: "Extracts structure from charts, screenshots, and interfaces, the reading step behind computer and browser use."
                Object detection / grounding:
                  Description: "Locates or points to image regions, returning coordinates rather than prose."
            Audio and speech workloads:
              Description: "Applications built on audio input or output, usually metered per second or minute rather than per token."
              children:
                Transcription and diarization:
                  Description: "Turns recorded speech into labelled text with speakers identified, priced by length of audio rather than by prompt size."
                Voice agents:
                  Description: "Interactive speech to speech assistants, where continuous audio and a strict latency budget make cost per conversation minute the unit that matters."
            Video workloads:
              Description: "Applications built on moving images, the heaviest input per minute of source content."
              children:
                Video understanding:
                  Description: "Summarizes or answers questions over recorded video, where frame rate and clip length drive cost more than prompt length does."
                Live and streaming video:
                  Description: "Continuous frame ingestion under a latency budget, where cost accrues per minute of stream rather than per request."
            Batch / offline jobs:
              Description: "Non-interactive bulk processing that can use discounted throughput."
            Workload characteristics:
              Description: "The properties that determine which optimizations and commitments make sense."
              children:
                Input to output ratio:
                  Description: "Whether a workload is dominated by reading or writing, which decides whether caching or output control is the lever."
                Latency sensitivity:
                  Description: "How much a delay costs, which sets whether batch pricing is available at all."
                Predictability:
                  Description: "How reliably future volume can be forecast, the precondition for any capacity commitment."
                Burstiness:
                  Description: "Peak to average ratio, which decides how much headroom must be paid for."
                Concurrency profile:
                  Description: "How many requests run at once, the main input to sizing a self-hosted deployment."
        Access & Delivery:
          Description: "How requests are sent and results returned, which affects price."
          children:
            Synchronous API:
              Description: "Standard request-response calls at full price."
            Batch API (discounted):
              Description: "Submitting jobs for asynchronous processing at a lower rate."
            Streaming vs non-streaming:
              Description: "Whether tokens stream as generated or return all at once."
            Sync vs async:
              Description: "Whether the caller waits or is notified when results are ready."
            Rate limits / quotas:
              Description: "Provider caps on request and token throughput."
              children:
                Requests and tokens per minute:
                  Description: "The two limits that bind in practice, often before any budget does."
                Concurrency caps:
                  Description: "Limits on simultaneous in-flight requests, which cap agent fan-out."
                Tier progression:
                  Description: "Limits that rise with spend history, making early scaling a function of account age as well as need."
            Self-hosting:
              Description: "Running open-weight models on owned or rented hardware, converting per-token cost into capacity cost."
            Edge and on-device:
              Description: "Running small models locally, which removes per-token cost and network latency at the price of capability."
            Aggregators and gateways:
              Description: "Intermediaries offering many models behind one interface, adding routing and failover at some margin. Where a product only passes traffic through and collects metadata it is a proxy; the Proxy, Router, and Gateway definitions live under Optimization and Routing."
            Reliability and continuity:
              Description: "Whether the capacity will be there when needed."
              children:
                Provider SLAs:
                  Description: "Contractual availability and support commitments, usually weaker than the equivalent for traditional cloud services."
                Multi-provider failover:
                  Description: "Keeping a second provider viable, which costs duplicated evaluation and prompt tuning."
                Region and data residency:
                  Description: "Where inference physically runs, which constrains provider choice and often price."
                Model deprecation:
                  Description: "Providers retire model versions on their own schedule, forcing migration work that was not planned or budgeted."
            Client-side resilience:
              Description: "How callers behave when limits and failures are hit, which decides whether pressure is absorbed or amplified."
              children:
                Exponential backoff:
                  Description: "Increasing the wait between retries, the standard response to rate limiting and the one clients most often get wrong."
                Token bucket limiting:
                  Description: "Client-side pacing against a refilling allowance, which smooths bursts before the provider rejects them."
                Circuit breakers:
                  Description: "Stopping calls to a failing dependency for a period, which prevents paying repeatedly for requests that cannot succeed."
                Idempotency keys:
                  Description: "Identifiers that let a retried request be recognised as the same call, avoiding duplicate work and duplicate billing."
                Backpressure:
                  Description: "Signalling upstream to slow down rather than queueing without bound, the difference between degraded and collapsed."
        Guardrails:
          Description: "Controls that keep output safe and correct, some of which cost extra tokens. Consumption owns enforcement and the measurement machinery; what counts as acceptable is the Quality Floor, owned by Value."
          children:
            Output validation:
              Description: "Checking responses against schemas or rules before use."
            Moderation / safety:
              Description: "Screening inputs and outputs for harmful content."
            Watermarking / provenance:
              Description: "Marks or certifies output for origin tracing under schemes such as SynthID and C2PA, an emerging compliance cost that adds per-request processing."
            Over-refusals and caveats:
              Description: "Over-refusals and appended caveats burn output tokens and trigger retries, a safety and quality tradeoff with direct token cost."
            Hallucination control:
              Description: "Techniques to reduce confident but wrong outputs."
            Groundedness and citation checking:
              Description: "Verifying that claims trace to retrieved sources, which costs additional calls but converts an unmeasurable risk into a measurable one."
            Retries (token cost):
              Description: "Re-running failed calls, a hidden and often overlooked cost."
            Production evals:
              Description: "Ongoing quality measurement of live traffic."
              children:
                LLM as judge:
                  Description: "Using a model to grade output, which is itself a token workload that scales with traffic."
                Offline vs online evaluation:
                  Description: "Testing against fixed sets before release versus sampling live traffic afterward."
                Regression detection:
                  Description: "Catching quality drops after a prompt or model change, the control that makes cost optimization safe to attempt."
                Golden datasets:
                  Description: "A curated set of cases with known good answers, the fixed reference any change is measured against."
                A/B testing:
                  Description: "Comparing variants on live traffic, the only way to see effects that offline sets cannot reproduce."
                Prompt versioning:
                  Description: "Tracking prompts as versioned artifacts, without which a quality or cost change cannot be traced to its cause."
            Human review:
              Description: "People checking model output, usually the most expensive component per item and the benchmark others are measured against."
            Adversarial input:
              Description: "Deliberate attempts to break the intended behaviour of a deployed model."
              children:
                Jailbreaking:
                  Description: "Prompts crafted to bypass a model's trained restrictions."
                Red teaming:
                  Description: "Structured adversarial testing before and after release, which finds failure modes normal evaluation does not."
                Abuse and cost attacks:
                  Description: "Traffic designed to consume expensive capacity, where the damage is the bill rather than the output."
            Data protection:
              Description: "Controls on what sensitive material reaches a model or a provider."
              children:
                PII detection and redaction:
                  Description: "Finding and removing personal data before it is sent, usually an extra model or classifier call per request."
                Data retention and training use:
                  Description: "Whether a provider stores prompts or trains on them, a contract term rather than a technical control."
        Demand:
          Description: "Understanding, measuring, and forecasting the drivers of AI consumption."
          children:
            Adoption and spend growth:
              Description: "How quickly pilots turn into material token budgets, which sets the pressure on every cost control downstream."
            Spend predictability:
              Description: "How reliably future token spend can be forecast from past usage, workload plans, and changes in agent behaviour."
            Bill shock:
              Description: "A gap between expected and actual spend that surfaces late, often driven by rapid usage growth, agent loops, or delayed cost visibility."
            Demand elasticity:
              Description: "How consumption changes as token prices change, determining whether lower unit prices reduce total spend or stimulate more usage."
        Purchase Options:
          Description: "How usage is bought from providers: the rate card, its modifiers, and the commercial structures around it. Purchasing mechanics rather than value measurement."
          children:
            Price axes:
              Description: "What the meter actually counts, which differs by provider and by modality."
              children:
                Input vs output token pricing:
                  Description: "Input and output tokens are billed at different rates, usually output higher."
                Cached token pricing:
                  Description: "Discounted rates for reused, cached prompt tokens."
                Per-request pricing:
                  Description: "Charging by call rather than by token, common for embeddings and small utility models."
                Per-unit media pricing:
                  Description: "Images, audio, and video priced by tile, second, or frame rather than by token."
                Capacity pricing:
                  Description: "Paying for dedicated throughput over time instead of for units consumed."
                Outcome pricing:
                  Description: "Charging per completed task rather than per token, which shifts efficiency risk to the seller."
            Price modifiers:
              Description: "Adjustments applied on top of the base rate."
              children:
                Price by model tier:
                  Description: "Different prices for models of different capability."
                Context length tiers:
                  Description: "Higher rates once a request exceeds a length threshold, which can make one long call cost more than several short ones."
                Batch API discounts:
                  Description: "Lower prices for non-urgent asynchronous jobs."
                Tiered / volume pricing:
                  Description: "Unit prices that fall with committed volume."
                Priority and latency tiers:
                  Description: "Paying more for faster or more reliable service, or less for best-effort."
                Regional pricing:
                  Description: "Rates that vary by where inference runs, reflecting local capacity and power cost."
            Capacity and commitment:
              Description: "Buying throughput ahead of time rather than consumption after the fact."
              children:
                Reserved capacity (PTUs / provisioned throughput):
                  Description: "Prepaid dedicated throughput for predictable cost and latency."
                Capacity blocks:
                  Description: "Fixed future windows of guaranteed accelerator time, priced separately from on-demand."
                Spot and preemptible:
                  Description: "Discounted capacity that can be reclaimed, viable only for interruption-tolerant work."
                Commitment risk:
                  Description: "Reserved capacity converts a variable cost into a fixed one, which is a saving only if the forecast holds."
                Utilization breakeven:
                  Description: "The usage level at which a commitment beats on-demand, the calculation that should precede any reservation."
            Price dynamics:
              Description: "How prices move over time and why."
              children:
                Price per unit of capability:
                  Description: "Cost to reach a given quality level, which has fallen even where headline rates have not."
                Hardware cost pass-through:
                  Description: "Changes in accelerator, power, and facility cost eventually reaching published rates."
                Scarcity premiums:
                  Description: "Prices reflecting availability rather than production cost during periods of constrained supply."
                Capability jumps versus price cuts:
                  Description: "Vendors may hold price and raise capability instead of cutting rates, which shows up as better value rather than lower spend."
                Deprecation and repricing:
                  Description: "Existing models being retired or repriced, which can raise the cost of an unchanged workload."
            Commercial structures:
              Description: "The contract forms buyers actually purchase under."
              children:
                Public rate cards:
                  Description: "Published per-token pricing, the reference point for everything else."
                Negotiated and private pricing:
                  Description: "Discounted terms at volume, which make public rates a poor basis for benchmarking."
                Credits and prepayment:
                  Description: "Money committed up front, often with expiry, which creates use-it-or-lose-it pressure."
                Overage terms:
                  Description: "What happens past a committed volume, frequently the least examined term in the contract."
        Observability:
          Description: "Visibility into the usage, cost, and quality of AI systems."
          children:
            Telemetry sources:
              Description: "Where the numbers come from, each with different coverage and trust."
              children:
                Engine metrics:
                  Description: "Counters emitted by the inference server, the only source that knows about cache hits, queue depth, and acceptance rates."
                Accelerator metrics:
                  Description: "Device-level utilization, memory, power, and temperature, which reveal whether hardware is earning its cost."
                Traces:
                  Description: "Per-request spans across services, the only way to attribute cost inside a multi-step agent run."
                Application and gateway logs:
                  Description: "Request-level records including model, tokens, and user, usually the practical basis for attribution."
                Billing and usage records:
                  Description: "The provider's own account of what was consumed, authoritative for spend and slow to arrive."
            Signals:
              Description: "What is worth measuring once the data is available."
              children:
                Usage & cost dashboards:
                  Description: "Live views of token consumption and spend."
                Utilization tracking:
                  Description: "Measuring how fully hardware is used, the key to cost efficiency."
                Quality / latency SLIs:
                  Description: "Indicators tracking response quality and speed."
                Cost per outcome:
                  Description: "Cost tied to a completed business result rather than raw usage."
                Efficiency signals:
                  Description: "Cache hit rate, acceptance rate, and batch occupancy, the numbers that explain why cost per token is what it is."
                Error and retry rates:
                  Description: "Failed and repeated work, which shows up as cost long before it shows up as a quality complaint."
            Practices:
              Description: "Turning telemetry into something anyone acts on."
              children:
                Reconciliation:
                  Description: "Checking engine and application counts against the invoice, which is where silent measurement errors surface."
                Tag propagation:
                  Description: "Carrying identity from the caller through gateways to the billing record, without which attribution breaks at the first hop."
                Alerting:
                  Description: "Notification on threshold breaches, useful only where a named owner can act."
                Sampling and retention cost:
                  Description: "Observability is itself an expense, and full-fidelity tracing of a high-volume token workload is not free."
            Standards / Open Specifications:
              Description: "Shared schemas that make measurement portable between tools and vendors."
              children:
                FOCUS:
                  Description: "The open specification for normalizing billing and usage data across providers, which makes cross-vendor comparison possible."
                OpenTelemetry:
                  Description: "The vendor-neutral standard for traces and metrics, including conventions for generative AI calls."
    Value:
      Description: "Owns the last part of Tokenomics, measuring the business value AI produces so investment is judged on outcomes rather than cost alone. Cost and utilization arrive from Production and Consumption as supporting scaffolding, not as the claim itself."
      children:
        Business Outcomes:
          Description: "What the AI changed and by how much, measured against a stated baseline. Anchors the Value layer: cost and utilization from the other layers only matter through the outcome they produce."
          children:
            Value Categorization:
              Description: "What the AI produces, framed for conversation rather than fixed. The fusion draft groups the ten categories by how the number is produced: direct dollar wins, labor categories estimated in hours or FTE, and reported outcomes. The groups differ in method, not worth, and no category outranks another."
              children:
                Revenue Enablement:
                  Description: "Revenue that would not exist without the AI. The number already sits in a ledger, so the argument is attribution rather than measurement."
                Cost Avoidance:
                  Description: "Spend that does not occur. Spend that went down is visible on an invoice, spend never incurred is a counterfactual. Spans most of the range by itself."
                Capacity Gain:
                  Description: "Same people produce more. Individually nice-to-haves, in aggregate often the largest line. Freed capacity that nothing is spent on stays a tracked FTE estimate rather than a booked claim."
                Labor Augmentation:
                  Description: "AI does part of the task and the human stays in the loop. The gain shows up as throughput or hours per unit before it shows up as headcount, measured against the human alone."
                Labor Automation:
                  Description: "AI does the task end to end. Trivial to compute and hardest to defend: needs the best-of-either baseline and a cleared quality gate, and raises who owns the decision once the human is out of the loop."
                Product Quality:
                  Description: "Fewer defects, less rework, better product. Quality of the work the business ships, deliberately renamed from Output Quality to keep it from being confused with the Quality Floor signal. Measurable only once the workload has a defined floor and instrumentation."
                Speed to Market:
                  Description: "Faster delivery of changes. Cycle time is usually available, what a week of earlier delivery is worth usually is not. Resolves into revenue pulled forward or spend avoided."
                Risk Reduction:
                  Description: "Exposure, liability, or security posture materially improved. The value is a loss that did not occur, so the claim rests on an expected-loss estimate and should say so plainly."
                New Capability:
                  Description: "Something not previously possible, with no prior state to measure against. The claim is about viability rather than delta: name the alternative you chose not to build."
                Employee Engagement:
                  Description: "Candidate tenth category, renamed from Job Satisfaction to name the actual I-O psychology construct. An AI program changes engagement along three facets, of which the claim carries only the behavioral top line: retention rates, productivity, and counterproductive work behaviors such as withdrawal or sabotage, measured with engagement surveys and incident reports. No forced conversion: the defensible move is to report it, not book it."
                  children:
                    Cognitive facet:
                      Description: "Fit and skill match: whether the job is changing toward or away from what the person is good at. Part of the construct's full decomposition, documented for the WG record rather than carried on the claim."
                    Affective facet:
                      Description: "Feelings toward the organization: whether AI change management was done well or people are worried about layoffs. Part of the full decomposition, not carried on the claim."
                    Behavioral facet:
                      Description: "What shows up in the data: retention, productivity, and counterproductive work behaviors including withdrawal and sabotage. The facet the reported claim is built on."
            Value Measurement:
              Description: "How a value claim is constructed and defended. The categories name what changed; these nodes are the how."
              children:
                Baseline:
                  Description: "The comparison a value claim rests on, ideally the best available alternative rather than a stale before-AI state. Baselines go stale quickly and created processes may have none."
                No-baseline problem:
                  Description: "Workloads where AI created the process so no counterfactual exists. The hardest measurement case, handled with bounded estimates rather than solved."
                Claim chain:
                  Description: "The how-to workflow, in three parts rather than layers, since layer is reserved for the technical stack. Part one the delta, what moved, with a unit and a direction. Part two the conversion, a baseline so the delta is real and a quality gate so it counts. Part three the destination, where a booked number lands, a closed set because the financial statements are a closed set."
                  children:
                    Stated stopping point:
                      Description: "The conversion is available, not mandatory: teams managing in time may stop at the delta and report hours or FTE equivalents. The chain requires the claim to name where it stopped, so a freed hour is never quietly counted as a booked dollar. Mandatory for anyone booking to a statement, optional for anyone managing in time."
                    Destinations:
                      Description: "The five places a booked number lands: new revenue won, revenue retained, spend removed, spend avoided, capital freed. Defensibility lives at the conversion step, not at the destination."
                    Role ladder:
                      Description: "Each scope from IC to C-Suite answers the value question at a different range and has its own natural unit, hours per task at the bottom, P and L lines and market position at the top. Estimates add up within a scope, not across scopes."
                Unit of measure:
                  Description: "Dollars, hours, or FTE equivalents, chosen per audience. Dollars read to executives, hours and FTE equivalents read to operational leads, and some outcomes deliberately stay unconverted."
                Horizontal rollout attribution:
                  Description: "Time saved by a company-wide assistant does not automatically become organizational value, the buying-coffee-with-that problem. Vertical workloads are measurably easier than horizontal ones."
                Augmentation and automation:
                  Description: "The old single Labor Offset label let teams claim augmentation and defend it with automation math. The split into two categories is the resolution: they need different baselines, human alone versus best-of-either, and saying which one you mean is most of the defense. What freed people move to afterwards stays open."
                Product versus internal posture:
                  Description: "Restored as the what of common AI task types: Product AI is customer-facing and judged on growth and margin, Internal AI is operational and judged on cost and efficiency. The posture picks the scoreboard but never changes the measurement math, and packaging never decides posture, consumption does."
                  children:
                    Internal product workload:
                      Description: "AI-enabled features built and packaged like a product for internal users. The goal is productivity, so it is measured as Internal AI no matter how well it is packaged."
                Value claim components:
                  Description: "A full claim names the workload or task type, the outcome measured, the unit, the baseline, and the quality the result was judged at."
                Quality Floor:
                  Description: "The pass bar for acceptable output on a specific workload: quality is the gate, not a multiplier. Value only counts when output clears the floor, cheap output that misses it is waste, and full utilization of a model that misses it is waste rather than efficiency."
                  children:
                    Task-specific criteria:
                      Description: "Code generation and creative summarization have different correctness criteria, so the floor is defined per workload. Leaderboard scores are a starting point for model selection, not a substitute for measuring on your own workload."
                    Defined before optimization:
                      Description: "Routing to cheaper models is impossible until acceptable has a definition, so the floor must exist before cost work begins."
                    Re-baselining:
                      Description: "A floor calibrated for one model generation goes stale for the next, so it must be re-established as models evolve."
                    Floor versus work quality:
                      Description: "The floor is a binary pass signal for the AI output; the Product Quality category means the quality of the work the business ships. The rename from Output Quality exists to keep the two from talking past each other."
            Outcome KPIs:
              Description: "The outcome-facing readouts of unit economics, where cost per unit stops describing production efficiency and starts describing business results."
              children:
                Cost per outcome:
                  Description: "Cost tied to a completed business result rather than raw usage, the natural bridge from unit economics into business outcomes."
                Cost per user:
                  Description: "Spend per active user over a period, the denominator that most directly connects usage to business metrics."
                Cost per session:
                  Description: "Spend across a full user interaction, the first denominator that reflects conversion rather than infrastructure."
        Unit Economics:
          Description: "The per-unit costs and efficiency ratios behind token spend."
          children:
            Cost denominators:
              Description: "What the spend is divided by, which is the choice that determines what the metric can tell you."
              children:
                Cost per token:
                  Description: "The rawest measure, useful for comparing infrastructure and nearly useless for comparing products."
                Cost per request:
                  Description: "Spend per API call, which hides wide variation in request size."
                Cost per agent run:
                  Description: "Spend for one complete autonomous task, the natural unit once workflows stop being single calls."
            Efficiency ratios:
              Description: "Production-side measures of how much output a resource yields."
              children:
                Tokens per dollar:
                  Description: "A throughput-per-cost efficiency metric and core optimization target."
                Tokens per watt:
                  Description: "Token output per unit of energy, an efficiency and sustainability measure."
                Tokens per GPU-hour:
                  Description: "How many tokens a GPU produces per hour, a utilization measure."
                Tokens per second per accelerator:
                  Description: "Instantaneous production rate, which combined with hourly cost yields cost per token directly."
            Margin:
              Description: "What is left after the cost of producing the tokens."
              children:
                Gross & contribution margin:
                  Description: "The profit left after token and serving costs."
                COGS composition:
                  Description: "How much of the cost is model calls, retrieval, storage, and human review, which shows where optimization would actually land."
                Blended cost:
                  Description: "A weighted average across the model mix, which is what finance sees and what hides the outliers."
            Cost drivers:
              Description: "The operational variables that move the unit number."
              children:
                Utilization:
                  Description: "The share of paid capacity doing useful work, the dominant driver for self-hosted serving."
                Cache hit rate:
                  Description: "The share of input served from cache, the dominant driver for prompt-heavy API workloads."
                Model mix:
                  Description: "The distribution of traffic across price tiers, usually more movable than any single price."
                Retry and failure rate:
                  Description: "Work paid for twice, which links quality engineering directly to unit cost."
                Input to output ratio:
                  Description: "Which side of the meter dominates, which determines whether prompt or generation is worth optimizing."
            Measurement pitfalls:
              Description: "Ways a unit economics figure can be technically correct and still mislead."
              children:
                Idle and reserved cost:
                  Description: "Capacity paid for but unused has to land somewhere, and burying it inflates the apparent cost of active work."
                Fixed cost amortization:
                  Description: "Training, evaluation, and platform cost spread over volume, which makes early unit costs look worse than the steady state."
                Attribution boundary:
                  Description: "Whether retrieval, storage, guardrails, and human review count toward the unit cost, which is a choice that must be stated to be comparable."
                Denominator drift:
                  Description: "A unit metric improving because the unit changed rather than because anything got cheaper."
        Monetization:
          Description: "How the value of tokens is captured as revenue."
          children:
            Usage-based / metered:
              Description: "Charging customers in proportion to tokens or calls used."
            Seat-based:
              Description: "Charging per user regardless of usage."
            Subscription / tiers:
              Description: "Recurring plans with bundled usage limits."
            Credits / prepaid:
              Description: "Selling usage credits customers draw down."
            Markup on token cost:
              Description: "Reselling tokens above their raw cost as the margin."
            Hybrid pricing:
              Description: "A base subscription plus metered overage, the common compromise between predictable revenue and cost coverage."
            Outcome-based pricing:
              Description: "Charging for completed work, which requires confident unit economics because the efficiency risk sits with the seller."
            Metering design:
              Description: "Choosing what the customer sees on their bill."
              children:
                Credit abstraction:
                  Description: "Exposing an internal unit rather than raw tokens, which preserves pricing freedom and obscures cost comparison."
                Cost pass-through vs absorption:
                  Description: "Whether upstream price changes reach the customer, which decides who carries provider pricing risk."
                Limits as product tiers:
                  Description: "Using rate and volume caps to differentiate plans, which turns a cost control into a packaging decision."
            Margin risk:
              Description: "Ways a pricing model stops covering its costs."
              children:
                Unbounded usage:
                  Description: "Flat-price plans meeting agentic workloads, where a small number of users can consume far beyond the average."
                Cost inflation exposure:
                  Description: "Committed customer pricing meeting rising provider or infrastructure cost."
                Abuse and automation:
                  Description: "Programmatic consumption of a plan priced for human use."
        Business Case:
          Description: "The justification for AI spend against its returns."
          children:
            ROI:
              Description: "The return generated relative to AI investment."
            TCO:
              Description: "The total cost of ownership across infrastructure, licensing, and operations."
            Build vs buy:
              Description: "Whether to self-host or use a managed provider."
            Payback period:
              Description: "How long until savings or revenue cover the investment."
            Value per token (quality, task completion):
              Description: "The business value a token delivers, not just its cost."
            Benchmark against existing cost:
              Description: "Comparing against the human or software cost the workload replaces, which is usually the number that decides funding."
            Opportunity cost:
              Description: "What the same capacity, capital, or team could have produced elsewhere."
            Risk adjustment:
              Description: "Discounting expected return for model, vendor, and regulatory uncertainty."
            AI Economics Architect (proposed persona):
              Description: "Designs the enterprise AI economic model connecting strategy, technology, total cost, governed action, measurable outcomes, and learning across Production, Consumption, and Value."
        Market Structure:
          Description: "The supply landscape that sets what any buyer can actually get and at what price."
          children:
            Supply chain:
              Description: "Silicon, memory, power, and facilities, each with its own lead time and constraint."
            Provider landscape:
              Description: "Model developers, hyperscalers, specialist accelerator clouds, and aggregators, each with a different cost basis."
            Capacity as a traded good:
              Description: "Accelerator time increasingly bought, resold, and brokered rather than only rented from a provider."
            Arbitrage:
              Description: "Exploiting price differences between providers, regions, or commitment types for the same effective capability."
            Concentration risk:
              Description: "Dependence on a small number of suppliers at several layers of the stack at once."
            Infrastructure price inflation:
              Description: "Rising cost of the underlying compute and facilities, which does not always appear in per-token rates but eventually constrains them."
